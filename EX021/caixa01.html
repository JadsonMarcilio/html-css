<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            
            background-color: bisque;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: black;

            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-right: 10px;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px; 

            /* margin:auto para colocar a caixa no meio */

            outline-width: 5px;
            outline-style: dashed;
            outline-color: burlywood;

            /* Podemos mudar a configuração padrão de um elemento para block ou inline usando: display:block ou display:inline, podemos misturar os dois também com display:inline-block */

    
        }

        a {
            border-width: 10px;
            border-style: solid;
            border-color: cadetblue;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Mas <a href="#">os links são exemplos de caixa inline-level</a>. Vamos ver como tudo isso funciona</p>
</body>
</html>
